                $ref: '#/components/schemas/DemandeAdministrationDto'
      security:
        - jwt: []
      summary: Traitement d’une demande
      tags:
        - RGPD
  /api/v1/rgpd/conservation/purge:
    post:
      description: Également planifiée chaque mois ; chaque exécution est journalisée.
      operationId: RgpdController_purger
      parameters: []
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapportConservationDto'
      security:
        - jwt: []
      summary: Exécution immédiate de la politique de conservation (RG-RGPD-04)
      tags:
        - RGPD
info:
  title: FORMACTIV — API REST
  description: >-
    API de la plateforme de gestion des formations et des compétences FORMACTIV.


    - Versionnée sous `/api/v1` (ADR-01), réponses JSON, pagination `page` / `limit`.

    - Authentification : jeton **Bearer** (access token 15 min) ; refresh token en cookie `httpOnly`.

    - Contrôle d’accès par rôle (matrice RBAC du chapitre 5), refus par défaut.

    - Erreurs normalisées `{ statusCode, code, message, details }` : 400 validation, 401, 403, 404, 409 règle de
    gestion, 423 compte verrouillé.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
    refresh:
      type: apiKey
      in: cookie
      name: formactiv_refresh
  schemas:
    EntreeJournalDto:
      type: object
      properties:
        id:
          type: string
        date:
          format: date-time
          type: string
        utilisateur:
          type: object
          nullable: true
        action:
          type: string
        typeObjet:
          type: object
          nullable: true
        idObjet:
          type: object
          nullable: true
        details:
          type: object
          nullable: true
        adresseIp:
          type: object
          nullable: true
      required:
        - id
        - date
        - action
    PageJournalDto:
      type: object
      properties:
        donnees:
          type: array
          items:
            $ref: '#/components/schemas/EntreeJournalDto'
        total:
          type: number
        page:
          type: number
        limit:
          type: number
      required:
        - donnees
        - total
        - page
        - limit
    ModificationParametreDto:
      type: object
      properties:
        valeur:
          type: string
          example: '12'
      required:
        - valeur
    ConnexionDto:
      type: object
      properties:
        email:
          type: string
          example: nadia.rey@formactiv.fr
        motDePasse:
          type: string
          format: password
      required:
        - email
        - motDePasse
    EntrepriseResumeDto:
      type: object
      properties:
        id:
          type: string
        raisonSociale:
          type: string
      required:
        - id
        - raisonSociale
    ProfilDto:
      type: object
      properties:
        id:
          type: string
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - RESP_FORMATION
            - FORMATEUR
            - APPRENANT
            - CLIENT_ENTREPRISE
        mfaActive:
          type: boolean
        mfaEnrolementRequis:
          type: boolean
          description: MFA obligatoire pour le rôle mais non configurée (RG-AUTH-03).
        entreprise:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/EntrepriseResumeDto'
      required:
        - id
        - nom
        - prenom
        - email
        - role
        - mfaActive
        - mfaEnrolementRequis
    ReponseConnexionDto:
      type: object
      properties:
        mfaRequis:
          type: boolean
          description: Vrai si un code de double authentification est attendu.
        jetonMfa:
          type: string
          description: 'Présent si mfaRequis : à renvoyer sur POST /auth/mfa.'
        accessToken:
          type: string
        expireDans:
          type: number
        utilisateur:
          $ref: '#/components/schemas/ProfilDto'
      required:
        - mfaRequis
    VerificationMfaDto:
      type: object
      properties:
        jetonMfa:
          type: string
          description: Jeton intermédiaire reçu à l’étape de connexion (5 min).
        code:
          type: string
          example: '123456'
      required:
        - jetonMfa
        - code
    SessionDto:
      type: object
      properties:
        id:
          type: string
        formation:
          $ref: '#/components/schemas/FormationDeSession'
        dateDebut:
          type: string
        dateFin:
          type: string
        lieu:
          type: object
          nullable: true
        capaciteMax:
          type: object
          nullable: true
        statutTemporel:
          type: string
          enum:
            - A_VENIR
            - EN_COURS
            - TERMINEE
        nombreInscrits:
          type: number
          description: Inscriptions en attente, validées ou terminées
        placesOccupees:
          type: number
          description: Inscriptions occupant une place (RG-SESS-03)
        formateurs:
          type: array
          items:
            $ref: '#/components/schemas/FormateurAffecteDto'
        alerteSansFormateur:
          type: boolean
          description: Sans formateur à l’approche du début (RG-SESS-02)
        notesManquantes:
          type: number
          description: Notes attendues non saisies (UC-08)
      required:
        - id
        - formation
        - dateDebut
        - dateFin
        - statutTemporel
        - nombreInscrits
        - placesOccupees
        - formateurs
        - alerteSansFormateur
        - notesManquantes
    MotDePasseOublieDto:
      type: object
