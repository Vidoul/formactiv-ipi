  /api/v1/auth/login:
    post:
      description: >-
        Si la MFA est active, renvoie `mfaRequis: true` et un jeton intermédiaire à présenter sur POST /auth/mfa. Sinon,
        renvoie l’access token et pose le refresh token en cookie httpOnly.
      operationId: AuthController_connecter
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReponseConnexionDto'
        '401':
          description: Identifiants invalides (message générique).
        '423':
          description: Compte temporairement verrouillé (RG-AUTH-02).
      summary: Connexion email + mot de passe (UC-01)
      tags:
        - Authentification
  /api/v1/auth/mfa:
    post:
      operationId: AuthController_verifierMfa
      parameters: []
      requestBody:
        required: true
        content:
