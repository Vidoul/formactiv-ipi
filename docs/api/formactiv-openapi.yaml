# Généré par `npm run openapi:export -w apps/api` — NE PAS MODIFIER À LA MAIN.
# Source de vérité : décorateurs @nestjs/swagger des contrôleurs de apps/api/src.
openapi: 3.0.0
paths:
  /api/v1/journal:
    get:
      description: Filtres utilisateur, action et période ; réservé à l’administrateur.
      operationId: JournalController_lister
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: utilisateur
          required: false
          in: query
          description: Nom, prénom ou email de l’auteur ; « système » possible
          schema:
            type: string
        - name: action
          required: false
          in: query
          schema:
            example: CHANGEMENT_ROLE
            type: string
        - name: jours
          required: false
          in: query
          description: Profondeur en jours
          schema:
            type: number
            enum:
              - 7
              - 30
              - 90
              - 365
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageJournalDto'
      security:
        - jwt: []
      summary: Consultation filtrée du journal (UC-15, US-32, RG-LOG-01)
      tags:
        - Journal d’audit
  /api/v1/parametres:
    get:
      operationId: ParametresController_lister
