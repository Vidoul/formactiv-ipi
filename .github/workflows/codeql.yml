# Analyse de sécurité du code (SAST) : GitHub CodeQL, requêtes « security-extended ».
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  # Lecture de l'exécution en cours (requise par l'action d'analyse) et publication des résultats.
  actions: read
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
