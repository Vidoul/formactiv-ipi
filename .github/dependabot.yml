# Veille des dépendances (ADR-06, risque R8) : propositions de mise à jour hebdomadaires,
# regroupées pour limiter le bruit ; chacune passe par l'intégration continue.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      correctifs:
        update-types: [patch, minor]
    # Montées de version majeures : planifiées et traitées manuellement (ADR-06).
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
