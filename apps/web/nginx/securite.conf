# En-têtes de sécurité des ressources du front (chapitre 10, OWASP A05). Inclus dans chaque
# bloc « location » servant des fichiers : Nginx n'hérite pas des add_header d'un niveau
# supérieur dès qu'un bloc en déclare. Aucune ressource externe n'est chargée par l'application.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
